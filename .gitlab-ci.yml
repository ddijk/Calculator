# Define stages
stages:
  - build

# Define variables
variables:
  GIT_STRATEGY: clone
  DOCKER_TLS_CERTDIR: ""
  CI_SERVER_URL: "http://gitlab" 

# Your job
job_name:
  stage: build
  image: maven:3.9.4-eclipse-temurin-17
  tags:
    - calc
  script:
    - echo "My Running calc job"
    # Add more commands here
    - mvn test
  # Optional: add before_script to check environment
  before_script:
    - echo "Checking environment..."
    - pwd
    - ls -la
