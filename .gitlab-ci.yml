# Define stages
stages:
  - build

# Define variables
variables:
  GIT_STRATEGY: clone
  DOCKER_TLS_CERTDIR: ""
  CI_SERVER_URL: "http://gitlab" 
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: 
    files:
      - pom.xml  # Cache changes when pom.xml changes
  paths:
    - .m2/repository

# Your job
job_name:
  stage: build
  image: maven:3.9.4-eclipse-temurin-17
  tags:
    - calc
  script:
    - echo "My Running calc job"
    # Add more commands here
    - mvn test
  # Optional: add before_script to check environment
  before_script:
    - echo "Checking environment...prj_dir=$CI_PROJECT_DIR slug:$CI_COMMIT_REF_SLUG"
    - pwd
    - ls -la
